<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trophinder</title>
    <link rel="stylesheet" href="../css/menu.css">
</head>
<body>

    <header>
        <h1>Trophinder</h1>
    </header>

    <main>

        <section class="top-rated">
            <h2>Restaurantes mejor calificados</h2>
            <div class="slider-container">
                <button class="arrow left" id="prevBtn">
                    &#10094;
                </button>

                <div class="slider" id="slider">

                    <div class="restaurant-card">
                        <img src="../assets/estancia.png" alt="Restaurante">
                        <h3>La Estancia</h3>
                        <p>⭐ 4.9</p>
                    </div>

                    <div class="restaurant-card">
                        <img src="../assets/antigua.png" alt="Restaurante">
                        <h3>Antigua Grill</h3>
                        <p>⭐ 4.8</p>
                    </div>

                    <div class="restaurant-card">
                        <img src="../assets/maya.png" alt="Restaurante">
                        <h3>Casa Maya</h3>
                        <p>⭐ 4.8</p>
                    </div>

                    <div class="restaurant-card">
                        <img src="../assets/patio.jpg" alt="Restaurante">
                        <h3>El Patio</h3>
                        <p>⭐ 4.7</p>
                    </div>

                    <div class="restaurant-card">
                        <img src="../assets/emiliano.jpg" alt="Restaurante">
                        <h3>Don Emiliano</h3>
                        <p>⭐ 4.7</p>
                    </div>

                    <div class="restaurant-card">
                        <img src="../assets/asador.png" alt="Restaurante">
                        <h3>El Asador</h3>
                        <p>⭐ 4.6</p>
                    </div>

                    <div class="restaurant-card">
                    <img src="../assets/sushi.jpg" alt="Restaurante">
                    <h3>Sushi House</h3>
                    <p>Japonesa</p>
                    <span>⭐ 4.9</span>
                </div>
                
                </div>

                <button class="arrow right" id="nextBtn">
                    &#10095;
                </button>

            </div>

        </section>

        <section class="recommendation-section">

            <div class="recommendation-card">

                <h2>Recomendarme restaurantes</h2>

                <p>
                    Obtén recomendaciones personalizadas según tus gustos y preferencias.
                </p>

                <button class="recommend-btn">
                    Buscar recomendaciones
                </button>

            </div>

        </section>

    </main>

    <script src="../js/menu.js"></script>

</body>
</html>
